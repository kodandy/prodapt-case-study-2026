# Same-origin SPA + API proxy (docs/specs/web.md decisions 2 and 7). No CORS on either service.
server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 64k;

  include /etc/nginx/snippets/security-headers.conf;

  # Docker's embedded DNS, re-queried at request time: a recreated gateway-api / ops-ai-api gets a
  # new IP, and a hostname in proxy_pass would be resolved only once at startup (502 until restart).
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  set $gw_upstream http://gateway-api:8000;
  set $ops_upstream http://ops-ai-api:8000;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_read_timeout 30s;
  proxy_hide_header Cache-Control;
  proxy_hide_header Pragma;

  # Routes the browser must not reach: password-only ops-ai tokens (no TOTP), API schemas,
  # and server-to-server or unused surfaces.
  location = /api/gw/v1/user-tokens { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-store" always; return 404; }
  location = /api/ops/v1/assistant/investigate-transfer { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-store" always; return 404; }
  location ^~ /api/gw/v1/disputes { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-store" always; return 404; }
  # Prometheus scrapes /metrics on the compose network only (docs/production-readiness.md, NFR-OBS).
  location ~ ^/api/(gw|ops)/metrics(/|$) { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-store" always; return 404; }
  location ~ ^/api/(gw|ops)/(docs|redoc|openapi\.json)(/|$) { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-store" always; return 404; }

  # POST /v1/payments takes a raw PAN and is server-to-server only (decision 6); the SPA only lists.
  location = /api/gw/v1/payments {
    limit_except GET { deny all; }
    rewrite ^ /v1/payments break;
    proxy_pass $gw_upstream;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  location /api/gw/ {
    rewrite ^/api/gw/(.*)$ /$1 break;
    proxy_pass $gw_upstream;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  location /api/ops/ {
    rewrite ^/api/ops/(.*)$ /$1 break;
    proxy_pass $ops_upstream;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    return 404;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    # No "always": a missing asset's 404 must not be cached for a year.
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
