# Same-origin SPA + API proxy (docs/specs/web.md decisions 2 and 7). No CORS on either service.
server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 64k;

  include /etc/nginx/snippets/security-headers.conf;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_read_timeout 30s;
  proxy_hide_header Cache-Control;
  proxy_hide_header Pragma;

  # Routes the browser must not reach: password-only ops-ai tokens (no TOTP), API schemas,
  # and server-to-server or unused surfaces.
  location = /api/gw/v1/user-tokens { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-store" always; return 404; }
  location = /api/ops/v1/assistant/investigate-transfer { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-store" always; return 404; }
  location ^~ /api/gw/v1/disputes { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-store" always; return 404; }
  location ~ ^/api/(gw|ops)/(docs|redoc|openapi\.json)(/|$) { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-store" always; return 404; }

  # POST /v1/payments takes a raw PAN and is server-to-server only (decision 6); the SPA only lists.
  location = /api/gw/v1/payments {
    limit_except GET { deny all; }
    proxy_pass http://gateway-api:8000/v1/payments;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  location /api/gw/ {
    proxy_pass http://gateway-api:8000/;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  location /api/ops/ {
    proxy_pass http://ops-ai-api:8000/;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    return 404;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    # No "always": a missing asset's 404 must not be cached for a year.
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
