name: payplat

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-payplat}:${POSTGRES_PASSWORD:-payplat-local-only}@postgres:5432/${POSTGRES_DB:-payplat}
  REDIS_URL: redis://redis:6379/0

x-readyz: &readyz
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
  interval: 2s
  timeout: 3s
  retries: 30

x-gateway-secrets: &gateway-secrets
  type: volume
  source: demo-secrets
  target: /run/secrets/gateway
  read_only: true
  volume: { subpath: gateway }

x-ops-ai-secrets: &ops-ai-secrets
  type: volume
  source: demo-secrets
  target: /run/secrets/ops-ai
  read_only: true
  volume: { subpath: ops-ai }

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payplat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payplat-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-payplat}
    ports: ["127.0.0.1:${POSTGRES_PORT:-55432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payplat}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-56379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  dev:
    profiles: ["dev"]
    build: { context: ., dockerfile: docker/dev.Dockerfile }
    volumes:
      - .:/workspace
      - venv:/opt/venv
      - uvcache:/root/.cache/uv
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-payplat}:${POSTGRES_PASSWORD:-payplat-local-only}@postgres:5432/${POSTGRES_DB:-payplat}
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /workspace
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # --- runtime services (make demo). One image, one command per process. ---

  demo-secrets:
    image: payplat-app
    build: { context: ., dockerfile: docker/app.Dockerfile }
    command: ["python", "scripts/demo_secrets.py", "/run/demo-secrets"]
    volumes: ["demo-secrets:/run/demo-secrets"]

  migrate:
    image: payplat-app
    environment: *app-env
    command:
      - sh
      - -c
      - alembic -c services/gateway/alembic.ini upgrade head && alembic -c services/ops-ai/alembic.ini upgrade head
    depends_on:
      postgres: { condition: service_healthy }

  seed:
    image: payplat-app
    environment:
      <<: *app-env
      # ops_ai.seed and scripts/demo.py import scripts.generate_dataset from the repo root
      PYTHONPATH: /app
    command: ["sh", "-c", "python -m ops_ai.seed && python -m ops_ai.transfers && python -m ops_ai.settlement"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  gateway-api:
    image: payplat-app
    environment:
      <<: *app-env
      GATEWAY_SECRETS_DIR: /run/secrets/gateway
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulator}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      GATEWAY_DB_ROLE: ${GATEWAY_DB_ROLE:-gateway_app}
    command: ["uvicorn", "--factory", "gateway.main:build_app_from_env", "--host", "0.0.0.0", "--port", "8000", "--timeout-graceful-shutdown", "20"]
    restart: unless-stopped
    ports: ["127.0.0.1:${GATEWAY_PORT:-8080}:8000"]
    volumes: [*gateway-secrets]
    healthcheck: *readyz
    depends_on: &runtime-deps
      demo-secrets: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Merchant gRPC API (B8.2): same image, settings and stores as gateway-api.
  gateway-grpc:
    image: payplat-app
    environment:
      <<: *app-env
      GATEWAY_SECRETS_DIR: /run/secrets/gateway
      GATEWAY_GRPC_PORT: "50051"
      # Plaintext gRPC is for the local demo only: the host port below is bound to 127.0.0.1. Set the TLS
      # paths (and GATEWAY_GRPC_INSECURE=false) for any deployment reachable beyond loopback.
      GATEWAY_GRPC_INSECURE: ${GATEWAY_GRPC_INSECURE:-true}
      GATEWAY_GRPC_TLS_CERT_PATH: ${GATEWAY_GRPC_TLS_CERT_PATH:-}
      GATEWAY_GRPC_TLS_KEY_PATH: ${GATEWAY_GRPC_TLS_KEY_PATH:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulator}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      GATEWAY_DB_ROLE: ${GATEWAY_DB_ROLE:-gateway_app}
    command: ["python", "-m", "gateway.merchant_api.grpc_server"]
    restart: unless-stopped
    ports: ["127.0.0.1:${GATEWAY_GRPC_PORT:-50051}:50051"]
    volumes: [*gateway-secrets]
    depends_on: *runtime-deps

  relay:
    image: payplat-app
    environment:
      <<: *app-env
      GATEWAY_SECRETS_DIR: /run/secrets/gateway
      METRICS_PORT: "9100"
    command: ["python", "-m", "gateway.outbox.worker"]
    restart: unless-stopped
    volumes: [*gateway-secrets]
    depends_on: *runtime-deps

  notifier:
    image: payplat-app
    environment:
      <<: *app-env
      GATEWAY_SECRETS_DIR: /run/secrets/gateway
    command: ["python", "-m", "gateway.notifications.worker"]
    restart: unless-stopped
    volumes: [*gateway-secrets]
    depends_on: *runtime-deps

  ops-ai-api:
    image: payplat-app
    environment:
      <<: *app-env
      OPS_AI_SECRETS_DIR: /run/secrets/ops-ai
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command: ["uvicorn", "--factory", "ops_ai.main:build_app_from_env", "--host", "0.0.0.0", "--port", "8000", "--timeout-graceful-shutdown", "20"]
    restart: unless-stopped
    ports: ["127.0.0.1:${OPS_AI_PORT:-8081}:8000"]
    volumes: [*ops-ai-secrets]
    healthcheck: *readyz
    depends_on: &ops-ai-deps
      <<: *runtime-deps
      seed: { condition: service_completed_successfully }

  ops-ai-consumer:
    image: payplat-app
    environment:
      <<: *app-env
      METRICS_PORT: "9100"
    command: ["python", "-m", "ops_ai.ingest.worker"]
    restart: unless-stopped
    depends_on: *ops-ai-deps

  demo:
    profiles: ["demo"]
    image: payplat-app
    environment:
      <<: *app-env
      PYTHONPATH: /app
      GATEWAY_SECRETS_DIR: /run/secrets/gateway
      GATEWAY_URL: http://gateway-api:8000
      OPS_AI_URL: http://ops-ai-api:8000
    command: ["python", "scripts/demo.py"]
    volumes: [*gateway-secrets]
    depends_on:
      gateway-api: { condition: service_healthy }
      ops-ai-api: { condition: service_healthy }
      relay: { condition: service_started }
      notifier: { condition: service_started }
      ops-ai-consumer: { condition: service_started }

  # --- web client (docs/specs/web.md). Node runs only in pinned images. ---

  web:
    build: { context: ./web }
    ports: ["127.0.0.1:${WEB_PORT:-8082}:80"]
    restart: unless-stopped
    depends_on:
      gateway-api: { condition: service_healthy }
      ops-ai-api: { condition: service_healthy }

  web-dev:
    profiles: ["web-dev"]
    image: node:22.20.0-bookworm-slim
    working_dir: /web
    volumes:
      - ./web:/web
      - web-node-modules:/web/node_modules

  web-smoke:
    profiles: ["web-smoke"]
    image: mcr.microsoft.com/playwright:v1.55.1-noble
    working_dir: /web
    environment:
      WEB_URL: http://web:80
    volumes:
      - ./web:/web
      - web-node-modules:/web/node_modules
    depends_on:
      web: { condition: service_started }

  # --- monitoring (make monitoring-up): Prometheus + Grafana, bound to 127.0.0.1 only. ---

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes: ["./ops/prometheus:/etc/prometheus:ro"]
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-payplat-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    restart: unless-stopped

  # --- TLS (make tls-up): self-signed dev certificate generated into a volume, never committed. ---

  dev-cert:
    profiles: ["tls"]
    image: payplat-app
    user: "0"
    command: ["python", "/ops/gen_dev_cert.py", "/certs"]
    volumes:
      - ./ops/tls/gen_dev_cert.py:/ops/gen_dev_cert.py:ro
      - dev-cert:/certs

  web-tls:
    profiles: ["tls"]
    image: nginx:1.28.0-alpine
    ports: ["127.0.0.1:${WEB_TLS_PORT:-8443}:443"]
    volumes:
      - ./ops/tls/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - dev-cert:/certs:ro
    depends_on:
      dev-cert: { condition: service_completed_successfully }
      web: { condition: service_started }
    restart: unless-stopped

  # --- load test (make perf, P1-5): k6 on the compose network against gateway-api. ---

  k6:
    profiles: ["perf"]
    image: grafana/k6:1.2.3
    environment:
      GATEWAY_URL: http://gateway-api:8000
    volumes:
      - ./ops/perf:/perf:ro
      - ./docs/perf:/results

volumes:
  dev-cert:
  pgdata:
  venv:
  uvcache:
  demo-secrets:
  web-node-modules:
