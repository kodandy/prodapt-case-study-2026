# Local monitoring stack (compose profile "monitoring"). /metrics is scraped on the compose network only:
# the web proxy returns 404 for /api/(gw|ops)/metrics and the API ports are bound to 127.0.0.1.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway-api
    static_configs: [{ targets: ["gateway-api:8000"] }]
  - job_name: relay
    static_configs: [{ targets: ["relay:9100"] }]
  - job_name: ops-ai-api
    static_configs: [{ targets: ["ops-ai-api:8000"] }]
  - job_name: ops-ai-consumer
    static_configs: [{ targets: ["ops-ai-consumer:9100"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
