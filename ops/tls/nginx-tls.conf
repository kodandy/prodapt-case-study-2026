# TLS termination in front of the `web` service (compose profile "tls"): https://localhost:${WEB_TLS_PORT}.
# The dev certificate comes from ops/tls/gen_dev_cert.py in the `dev-cert` volume; nothing is committed.
server {
  listen 443 ssl;
  server_name localhost;
  server_tokens off;

  ssl_certificate /certs/dev.crt;
  ssl_certificate_key /certs/dev.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:tls:1m;

  add_header Strict-Transport-Security "max-age=300" always;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $web_upstream http://web:80;

  location / {
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
